<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOPCIT 교재 보기</title><link rel="stylesheet" href="viewer.css?v=reader3"></head>
<body><aside id="menu" aria-label="읽기 메뉴"><div><span class="eyebrow">TOPCIT · TEXTBOOK</span><h1 id="title">교재 보기</h1></div><a id="download" class="download" target="_blank" rel="noopener">PDF 다운로드 ↗</a>
<nav aria-label="교재 읽기 설정"><div class="pager"><button id="prev" aria-label="이전 페이지">←</button><label><span class="sr-only">PDF 페이지</span><input id="page" type="number" min="1" value="1"></label><span id="count"></span><button id="go">이동</button><button id="next" aria-label="다음 페이지">→</button></div><div class="options"><label><span class="sr-only">페이지 보기</span><select id="layout"><option value="auto">자동 · 화면 방향</option><option value="single">한 쪽 보기</option><option value="spread">두 쪽 보기</option></select></label><label><span class="sr-only">확대</span><select id="zoom"><option value="fit">화면 맞춤</option><option value="width">너비 맞춤</option><option value="1">100%</option><option value="1.5">150%</option><option value="2">200%</option><option value="3">300%</option></select></label><button id="fullscreen">전체 화면</button></div></nav><p class="hint">화면 왼쪽·오른쪽을 누르면 이동 · 가운데를 누르면 메뉴</p></aside><main><section id="setup" hidden><h2>교재를 열지 못했습니다</h2><p>다시 시도하거나 내려받은 교재 파일을 선택하세요.</p><label>PDF 선택 <input id="file" type="file" accept="application/pdf,.pdf"></label></section>
<section id="reader" hidden><div id="canvas-wrap" tabindex="0" aria-label="교재 본문"><div id="pages"></div></div></section>
<section id="loading" aria-label="교재 로딩"><strong id="loading-label">교재 다운로드</strong><output id="percent">0%</output><progress id="progress" max="100" value="0"></progress></section><p id="status" role="status" aria-live="polite">교재를 불러오는 중입니다.</p></main><script type="module" src="viewer.mjs?v=reader3"></script></body></html>
